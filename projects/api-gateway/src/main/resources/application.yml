server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: base-template
          uri: lb://BASE-TEMPLATE
          predicates:
            - Path=/api/**
          filters:
            # Forward the Keycloak access token from the Gateway session to the service.
            - TokenRelay

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            # The Gateway signs the browser in with Keycloak using Authorization Code flow.
            client-id: api-gateway
            client-secret: ${KEYCLOAK_GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            # Keycloak realm that authenticates users and issues tokens.
            issuer-uri: http://localhost:8180/realms/microservices

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info