server:
  port: 8080

spring:
  application:
    name: base-template
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate access tokens against the same Keycloak realm used by the Gateway.
          issuer-uri: http://localhost:8180/realms/microservices

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
